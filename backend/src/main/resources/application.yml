spring:
  config:
    import: optional:classpath:application-local.yml
  servlet:
    multipart:
      max-file-size: 10MB
      # Help content attachments allow up to 5 files per upload (HelpContentService
      # .MAX_ATTACHMENTS_PER_CONTENT) at up to 10MB each in one multipart request.
      max-request-size: 55MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        # Required for Shift.startTime/endTime's LocalTimeTextConverter (see its own Javadoc):
        # that converter binds a plain String against a native `TIME WITHOUT TIME ZONE` column
        # deliberately, to make the value immune to any timezone/Calendar participation at all —
        # but pgjdbc's default "stringtype=varchar" sends untyped String parameters with an
        # explicit varchar OID, which Postgres then refuses to implicitly cast to `time` ("column
        # ... is of type time without time zone but expression is of type character varying").
        # "unspecified" sends them with no OID instead, letting Postgres resolve the cast itself
        # from context — exactly how a plain SQL text literal ('15:30:00') already behaves, with
        # no schema change and no effect on any other typed binding (UUID, timestamptz, int, ...),
        # which continue to bind with their own explicit types exactly as before.
        stringtype: unspecified
  jpa:
    hibernate:
      # Override validate — Flyway owns the schema; ddl-auto: validate
      # fails on citext/timestamptz column types reported by Postgres metadata
      ddl-auto: none
    properties:
      hibernate:
        # Pin JDBC TIME/TIMESTAMP conversion to a fixed zone. Without this, Hibernate
        # uses the JVM default zone (IST locally) for java.sql.Time <-> LocalTime
        # conversion, and historical Asia/Kolkata offset data can produce an
        # out-of-range NanoOfSecond when reading TIME columns back out.
        jdbc:
          time_zone: UTC
  flyway:
    # This is a shared dev database that multiple feature branches migrate against
    # directly (see V40/V47 header comments), so a branch's local migration folder
    # can lag behind versions another branch already applied ("missing"), or a branch
    # can pull a migration file before the DB it's testing against has caught up
    # ("future"). Neither is corruption — don't fail validation over either.
    ignore-migration-patterns: "*:missing,*:future,*:pending,*:ignored"
    validate-on-migrate: false

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5180,http://localhost:5173,http://localhost:3000}
  base-url: ${APP_BASE_URL:http://localhost:5180}
  attendance:
    # Business timezone — deploy-time default. Deliberately explicit, since the JVM default is
    # UTC on Railway. As of the Phase 2 timezone pass, the Attendance/Web-Clock-In/Regularization
    # flow no longer reads this directly — it uses AttendanceRulesService.getDefaultZoneId(), an
    # Admin-configurable singleton seeded from this same value (see V167). This YAML value
    # remains the source for every OTHER org-wide "what business day is it" consumer (Leave,
    # Penalization Policy, EmployeeAssignmentService, ExceptionService, AttendanceRequestService).
    zone: ${ATTENDANCE_ZONE:Asia/Kolkata}
    # A fixed fallback shift-start was removed entirely (no replacement) — every employee is now
    # a hard invariant to always have a real assigned Shift (see Shift.DEFAULT_SHIFT_NAME's
    # server-side default on creation, ShiftSeedCorrector's startup backfill, and OrgService's
    # refusal to rename/deactivate/delete the default shift itself). ShiftDayPolicy throws for a
    # null-shift employee everywhere, including resolveShiftStart/shiftEndAt — there is no
    # fixed-clock-time fallback anywhere in that class by design.
    # late-grace-minutes previously lived here as the sole org-wide LATE/PRESENT status gate. As
    # of the Phase 3 grace pass, grace is no longer a single global value — every Shift Version
    # now has its own (shift_versions.late_grace_minutes, see V168), Admin-editable per Shift via
    # the Shifts tab, resolved by ShiftDayPolicy#resolveLateGraceMinutes. Removed outright (not
    # left as a dead/unused fallback) — there is no hidden global override of a Shift's own grace.
    # half-day-max-hours, full-day-min-hours and daily-break-budget-minutes previously lived here.
    # half-day-max-hours is now a persisted, Admin-editable org setting — see AttendanceRules/
    # AttendanceRulesService/V162 (GET/PUT /api/org/attendance-rules). full-day-min-hours was
    # removed outright (proven dead — AttendanceResponse.fullDay had zero readers anywhere).
    # daily-break-budget-minutes was removed outright (display-only progress-bar denominator, no
    # enforcement, not the same concept as the already-persisted, per-shift
    # ShiftVersion.breakMinutes). See scratch/workstream-b-settings-investigation.md for the full
    # audit behind each of these three.
    regularization:
      # N-day lookback window (counting today itself) for regularization requests submitted by
      # anyone other than Super Admin, who is exempt entirely — see
      # RegularizationService.submit/update/validateLookbackWindow. E.g. 7 with today=19th
      # allows the 19th through the 13th and blocks the 12th onward. NOT migrated to a persisted
      # Admin setting — pending a future, dedicated Regularization Policy that will own this
      # alongside monthly-limit and other regularization-specific configuration.
      employee-lookback-days: 7
      # Max regularization requests a non-Super-Admin employee may submit per calendar month
      # (counts every submission regardless of eventual status). Super Admin is exempt. Same
      # future-Regularization-Policy note as employee-lookback-days above.
      monthly-limit: 3
resend:
  api-key: ${RESEND_API_KEY}
  from: OneHR <onehr@nforceone.com>

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.nforce.onehr: DEBUG
    org.flywaydb: WARN
